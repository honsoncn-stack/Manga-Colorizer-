name: Bug 反馈
description: 反馈 Manga Auto Colorizer 1.0 使用中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填写下面的信息，方便复现和修复。
        请不要上传受版权保护的漫画原图、整本 PDF、模型权重或个人隐私文件。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 例如 1.0.0、GitHub Release 名称，或提交号
      placeholder: "1.0.0"
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 安装 / 启动
        - 书库导入
        - 阅读器
        - 上色队列
        - PDF 导出
        - 图库
        - 日志 / 设置
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出你做了什么
      placeholder: |
        1. 打开应用
        2. 导入 PDF
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: "我期望看到 ..."
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: "实际发生了 ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 可以复制应用「记录」页面里的错误记录或阅读记录，注意删掉个人路径里的隐私信息
      render: text
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、显卡、Python/Conda 路径、是否使用安装包或源码启动
      placeholder: |
        Windows 11
        GPU: ...
        启动方式：安装包 / 源码开发版
